name: Database setup (manual)

on:
  workflow_dispatch:
    inputs:
      push_schema:
        description: Create/update tables
        type: boolean
        default: true
      run_sql:
        description: Run Supabase SQL files
        type: boolean
        default: false
      seed:
        description: DANGER — delete and reload the Vala demo hotel's data
        type: boolean
        default: false

concurrency:
  group: db-setup
  cancel-in-progress: false

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check secrets
        run: |
          for v in DATABASE_URL NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DEMO_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done

      - name: Push schema
        if: ${{ inputs.push_schema }}
        run: npx drizzle-kit push --force

      - name: Run Supabase SQL
        if: ${{ inputs.run_sql }}
        run: |
          for f in supabase/sql/*.sql; do
            echo "▶ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Reset and seed Vala demo
        if: ${{ inputs.seed }}
        run: npm run db:seed
